<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Activity Tracker — Aplikasi pelacak aktivitas dan manajemen waktu personal all-in-one yang cepat, intuitif, dan elegan.">
  <meta name="theme-color" content="#0b0f19">
  <title>Activity Tracker — Personal Productivity & Life Logger</title>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

  <!-- Core Design System Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="container header-content">
      <!-- Brand Logo -->
      <a href="#" class="header-brand" aria-label="Activity Tracker Beranda">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <span class="brand-name">Activity Tracker</span>
      </a>

      <!-- Current Local Date Indicator -->
      <div class="header-center" id="headerDate">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span id="currentDate">Memuat tanggal...</span>
      </div>

      <!-- Header Actions -->
      <div class="header-actions">
        <!-- Add Manual Log Button -->
        <button id="openManualModalBtn" class="btn btn-primary" type="button" aria-label="Tambah aktivitas manual">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Log Manual</span>
        </button>

        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" class="btn btn-icon" type="button" aria-label="Ganti tema gelap atau terang" title="Ganti Tema">
          <!-- Sun Icon (for Light mode) -->
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon Icon (for Dark mode) -->
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container Layout -->
  <main class="container main-layout">
    <!-- Hero Live Stopwatch Timer Section (Scaffolding for TASK003) -->
    <section id="timerSection" aria-label="Stopwatch Pelacak Waktu">
      <!-- Timer Component will be injected here -->
    </section>

    <!-- Overview Stats Metrics Section (Scaffolding for TASK006) -->
    <section id="statsSection" aria-label="Statistik Harian">
      <!-- Stats Cards will be injected here -->
    </section>

    <!-- Main Analytics & Timeline Feed Grid (Scaffolding for TASK005 & TASK006) -->
    <div class="dashboard-grid" id="mainGrid">
      <!-- Category Chart / Analytics Section -->
      <section id="analyticsSection" aria-label="Analisis Kategori">
        <!-- Chart.js component will be injected here -->
      </section>

      <!-- Activity Timeline Feed Section -->
      <section id="feedSection" aria-label="Daftar Aktivitas Hari Ini">
        <!-- Activity List & Filter pills will be injected here -->
      </section>
    </div>
  </main>

  <!-- App Footer -->
  <footer class="app-footer">
    <div class="container">
      <p>Activity Tracker &copy; 2026 Fahdil Raihandi &bull; Personal Productivity & Life Logger</p>
    </div>
  </footer>

  <!-- Modal Container -->
  <div id="modalContainer" aria-live="polite"></div>

  <!-- Toast Container -->
  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
